apiVersion: apps/v1
kind: Deployment
metadata:
  name: pt-readiness-portal-deployment
  namespace: cobra
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app: pt-readiness-portal
    app.kubernetes.io/name: pt-readiness-portal
    app.kubernetes.io/component: federal-services
    app.kubernetes.io/part-of: iidi-tech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pt-readiness-portal
  template:
    metadata:
      labels:
        app: pt-readiness-portal
        app.kubernetes.io/name: pt-readiness-portal
        app.kubernetes.io/component: federal-services
        app.kubernetes.io/part-of: iidi-tech
    spec:
      containers:
      - name: pt-readiness-portal
        image: northamerica-northeast1-docker.pkg.dev/gcdm022b-cobra/iidi/iidi-pt-readiness-portal:v2.9
        imagePullPolicy: Always
        ports:
        - containerPort: 8050
        env:
        - name: CSV_PATH
          value: "/data/responses.csv"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1"
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 8050
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 8050
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
